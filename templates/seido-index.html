<meta property="og:type" content="website">
<meta property="og:title" content="制度計算｜税金・保険料まるごとシミュレーター">
<meta property="og:description" content="お住まいの市区町村を選ぶだけで、住民税・国民健康保険・介護保険の年間負担をまとめて試算。">

<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;margin:0;padding:20px;background:linear-gradient(180deg,#eef2ff 0%,#f8fafc 100%);color:#1f2937;min-height:100vh;-webkit-text-size-adjust:100%;}
  .wrap{max-width:560px;margin:0 auto;background:#ffffff;padding:32px 22px 36px;border-radius:18px;border:1px solid #e5e7eb;box-shadow:0 10px 30px rgba(0,0,0,0.05);box-sizing:border-box;}
  .brand{font-size:14px;font-weight:700;color:#7fd4e6;text-align:center;letter-spacing:0.04em;}
  .tagline{font-size:12px;font-weight:600;color:#7fd4e6;text-align:center;margin-bottom:18px;}
  h1{font-size:clamp(24px,4.4vw,30px);font-weight:800;color:#0f172a;text-align:center;margin:6px 0 8px;line-height:1.4;}
  .lead{font-size:15px;color:#374151;line-height:1.8;text-align:center;margin:0 0 26px;}
  label{display:block;font-size:14px;font-weight:700;margin:16px 0 7px;color:#111827;}
  select{width:100%;padding:14px 12px;font-size:17px;font-weight:500;border:2px solid #cbd5e1;border-radius:12px;background:#fff;color:#0f172a;box-sizing:border-box;appearance:none;-webkit-appearance:none;}
  select:focus{outline:none;border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,0.15);}
  select:disabled{background:#f3f4f6;color:#9ca3af;}
  button{width:100%;margin-top:24px;padding:16px;font-size:17px;font-weight:700;border:none;border-radius:999px;background:#1d4ed8;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(29,78,216,0.25);}
  button:hover{background:#1e40af;}
  button:disabled{background:#cbd5e1;box-shadow:none;cursor:not-allowed;}
  .systems{display:flex;justify-content:center;gap:18px;margin:24px 0 0;font-size:13px;color:#475569;}
  .systems span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;}
  .dot.soon{background:#cbd5e1;}
  .status{margin-top:22px;font-size:12px;color:#6b7280;text-align:center;line-height:1.8;}
  .footer{text-align:center;margin-top:28px;}
  .footer a{display:inline-block;text-decoration:none;border-radius:10px;padding:6px 18px;background:#7fd4e6;}
  .footer .f1{font-size:16px;font-weight:700;color:#fff;letter-spacing:0.02em;}
  .footer .f2{font-size:11px;font-weight:500;color:#fff;margin-top:1px;}
</style>

<body>

<div class="wrap">
  <div class="brand">制度計算</div>
  <div class="tagline">市民 ↔ 制度</div>

  <h1>税金・保険料、<br>まるごと計算</h1>
  <p class="lead">お住まいの市区町村を選ぶと、<br>住民税・国民健康保険・介護保険の<br>年間負担をまとめて試算できます。</p>

  <label for="pref">都道府県</label>
  <select id="pref"><option value="">選択してください</option></select>

  <label for="city">市区町村</label>
  <select id="city" disabled><option value="">先に都道府県を選択</option></select>

  <label for="system">制度</label>
  <select id="system">
    <option value="kakeibo" data-label="まとめて試算（家計簿シミュレーター）" selected>まとめて試算（家計簿シミュレーター）</option>
    <option value="jumin" data-label="住民税">住民税</option>
    <option value="kokuho" data-label="国民健康保険">国民健康保険</option>
    <option value="hoiku" data-label="保育料">保育料</option>
    <option value="kaigo" data-label="介護保険">介護保険</option>
    <option value="shaho" data-label="社会保険（会社員）">社会保険（会社員）</option>
  </select>

  <button id="go" disabled onclick="goCity()">家計簿シミュレーターを開く</button>

  <div class="systems">
    <span><i class="dot"></i>住民税</span>
    <span><i class="dot"></i>国民健康保険</span>
    <span><i class="dot"></i>介護保険</span>
  </div>

  <div class="status">現在 <b>試験公開中</b>（対象自治体は順次拡大します）。<br>計算結果は概算です。正確な額は各自治体の通知でご確認ください。</div>

  <div class="footer">
    <a href="https://civicrulelab.jp/">
      <div class="f1">Civic Rule Lab</div>
      <div class="f2">制度をひらく</div>
    </a>
  </div>
</div>

<script>
// 公開自治体インデックス（registry の jumin 公開分を生成時に注入）
// 形: { "愛知県": { slug:"aichi", cities:[ {slug:"nagoya", name:"名古屋市"} ] }, ... }
var CITY_INDEX = __CITY_INDEX__;

(function(){
  "use strict";
  var prefSel=document.getElementById("pref"), citySel=document.getElementById("city"), go=document.getElementById("go"), sysSel=document.getElementById("system");
  // 制度ごとの遷移先とボタン文言。国保は全国版（kokuho-keisan.jp）へ。
  // shaho（社会保険）は県単位＝県別ページ /{pref}/ へ（47県公開済み・2026-07-12）。citySlug不要。
  var SYSTEMS={
    kakeibo:{label:"家計簿シミュレーターを開く", url:function(p,c){return "/"+p+"/"+c+"/kakeibo/";}},
    jumin:  {label:"住民税の計算を開く",         url:function(p,c){return "/"+p+"/"+c+"/jumin/";}},
    kokuho: {label:"国民健康保険の計算を開く",   url:function(p,c){return "https://kokuho-keisan.jp/"+p+"/"+c+"/";}},
    hoiku:  {label:"保育料の計算を開く",         url:function(p,c){return "/"+p+"/"+c+"/hoiku/";}},
    kaigo:  {label:"介護保険の計算を開く",       url:function(p,c){return "/"+p+"/"+c+"/kaigo/";}},
    shaho:  {label:"社会保険（会社員）の計算を開く", prefOnly:true, url:function(p,c){return "https://shaho-keisan.jp/"+p+"/";}}
  };
  var prefNames=Object.keys(CITY_INDEX);
  prefNames.forEach(function(pn){
    var o=document.createElement("option"); o.value=pn; o.textContent=pn; prefSel.appendChild(o);
  });
  // shaho は県単位（prefOnly）＝都道府県の選択だけでボタンを有効化。他制度は市区町村まで必須。
  function updateGo(){
    var s=SYSTEMS[sysSel.value];
    var ok=(s&&s.prefOnly)?!!prefSel.value:(!!prefSel.value&&!!citySel.value);
    go.disabled=!ok;
  }
  // 選択中の自治体で「実際にページがある制度」だけを選択可能にする（未公開制度=404への遷移を防ぐ）。
  // shaho は県単位・外部サイトのため常に選択可。市区町村未選択時は全制度を仮有効（遷移はボタン/goCity側でガード）。
  function currentCitySys(){
    var pn=prefSel.value, cs=citySel.value;
    if(!pn||!cs) return null;
    var list=(CITY_INDEX[pn]&&CITY_INDEX[pn].cities)||[];
    for(var i=0;i<list.length;i++){ if(list[i].slug===cs) return list[i].sys||null; }
    return null;
  }
  function updateSystemAvail(){
    var sys=currentCitySys();
    for(var i=0;i<sysSel.options.length;i++){
      var opt=sysSel.options[i], v=opt.value, ok;
      if(v==="shaho"){ ok=true; }
      else if(!sys){ ok=true; }
      else { ok=!!sys[v]; }
      opt.disabled=!ok;
      opt.textContent=opt.getAttribute("data-label")+((sys&&!ok)?"（この自治体は準備中）":"");
    }
    // 選択中の制度が無効になったら最初の有効な制度へ退避（無効な既定に落とさない）
    if(sysSel.selectedOptions[0] && sysSel.selectedOptions[0].disabled){
      for(var j=0;j<sysSel.options.length;j++){ if(!sysSel.options[j].disabled){ sysSel.value=sysSel.options[j].value; break; } }
      var s=SYSTEMS[sysSel.value]; if(s) go.textContent=s.label;
    }
  }
  prefSel.addEventListener("change", function(){
    citySel.innerHTML="";
    var pn=prefSel.value;
    if(!pn){citySel.disabled=true; citySel.innerHTML='<option value="">先に都道府県を選択</option>'; updateSystemAvail(); updateGo(); return;}
    citySel.disabled=false;
    var ph=document.createElement("option"); ph.value=""; ph.textContent="市区町村を選択"; citySel.appendChild(ph);
    CITY_INDEX[pn].cities.forEach(function(c){
      var o=document.createElement("option"); o.value=c.slug; o.textContent=c.name; citySel.appendChild(o);
    });
    updateSystemAvail(); updateGo();
  });
  citySel.addEventListener("change", function(){ updateSystemAvail(); updateGo(); });
  sysSel.addEventListener("change", function(){
    var s=SYSTEMS[sysSel.value]; if(s) go.textContent=s.label;
    updateGo();
  });
  window.goCity=function(){
    var pn=prefSel.value, cs=citySel.value, sys=sysSel.value;
    var s=SYSTEMS[sys]||SYSTEMS.kakeibo;
    if(!pn) return;
    if(!s.prefOnly && !cs) return;
    if(!s.prefOnly){ var cSys=currentCitySys(); if(cSys && !cSys[sys]) return; } // 未公開制度=404へは遷移しない
    var prefSlug=CITY_INDEX[pn].slug;
    if(typeof gtag==="function")gtag("event","select_city",{prefecture:prefSlug,city:cs,system:sys});
    location.href=s.url(prefSlug,cs);
  };
})();
</script>

</body>
</html>
