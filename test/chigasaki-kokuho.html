<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/common.css">
<title>国民健康保険料計算｜茅ヶ崎市 国保計算ツール</title>
</head>

<body>

<div class="wrap">

  <h1 style="margin-top:8px;margin-bottom:6px;">茅ヶ崎市 国保計算ツール</h1>

  <div class="subtitle">国民健康保険料シミュレーション</div>

  <div class="mode-title" style="font-size:22px;font-weight:700;color:#1d4ed8;text-align:center;margin-bottom:16px;">かんたん計算</div>

  <label for="income">前年所得</label>
  <input id="income" type="text" inputmode="numeric" placeholder="例：3,000,000">

  <label for="family">世帯人数</label>
  <input id="family" type="number" placeholder="例：3">

  <label for="preschool">未就学児人数（0〜6歳）</label>
  <input id="preschool" type="number" placeholder="例：1">

  <label for="care">介護保険人数（40〜64歳）</label>
  <input id="care" type="number" placeholder="例：1">

  <label for="salaryPensionCount">給与・年金所得者数</label>
  <input id="salaryPensionCount" type="number" placeholder="例：1">

  <button onclick="calc()">計算する</button>

  <div class="result-title">計算結果</div>
  <div id="result"><span class="result-placeholder">ここに結果が表示されます</span></div>

  <div style="margin-top:16px;font-size:14px;color:#374151;">
    個人事業主の方など、所得で計算したい方は
    <a href="./kokuho-income.html">こちら</a>
  </div>

  <div class="back-link" style="margin-top:20px;">
    <a href="./selector.html">制度ポータルへ戻る</a>
  </div>

  <div class="note">
    ※このページは茅ヶ崎市向けの簡易計算版です。<br>
    ※基礎控除43万円を差し引いた簡易計算です。<br>
    ※軽減判定はA版の目安判定です。正式な判定ではありません。<br>
    ※未就学児軽減は均等割のみを対象に簡易反映しています。<br>
    ※実際の保険料は自治体の通知や公式案内でご確認ください。
  </div>

  <div style="text-align:center;margin-top:32px;padding-top:20px;border-top:1px solid #e5e7eb;">
    <div style="display:inline-block;border-radius:10px;padding:6px 18px;background:#7fd4e6;">
      <div style="font-size:16px;font-weight:700;color:#ffffff;letter-spacing:0.02em;">Civic Rule Lab</div>
      <div style="font-size:11px;font-weight:500;color:#ffffff;margin-top:1px;">市民 ↔ 制度</div>
    </div>
  </div>

</div>

<script src="./js/engine.js"></script>

</body>
</html>
