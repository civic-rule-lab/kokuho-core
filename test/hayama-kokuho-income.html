  テンプレート: 所得ベース計算ページ

    hayama   → 自治体スラグ（例: hiratsuka）
    葉山町   → 自治体名（例: 平塚市）

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/common.css?v=2">
<title>国民健康保険料計算｜葉山町 所得ベース計算</title>
</head>

<body>

<div class="wrap">

  <h1 style="margin-top:32px;margin-bottom:16px;font-size:clamp(28px,5vw,35px);">葉山町 国保計算ツール</h1>

  <div class="subtitle" style="margin-bottom:32px;">国民健康保険料シミュレーション</div>

  <div class="mode-title" style="font-size:28px;font-weight:700;color:#1d4ed8;text-align:center;margin-top:8px;margin-bottom:24px;">所得ベース計算</div>

  <label for="income">前年所得</label>
  <input id="income" type="text" inputmode="numeric" placeholder="例：3,000,000">

  <label for="family">世帯人数</label>
  <input id="family" type="number" placeholder="例：3">

  <label for="preschool">未就学児人数（0〜6歳）</label>
  <input id="preschool" type="number" placeholder="例：1">

  <label for="care">介護保険人数（40〜64歳）</label>
  <input id="care" type="number" placeholder="例：1">

  <label for="salaryPensionCount">給与・年金所得者数</label>
  <input id="salaryPensionCount" type="number" placeholder="例：1">

  <div id="assetLevyGroup" style="display:none">
    <label for="fixedAssetTax">固定資産税額（資産割対象の方のみ）</label>
    <input id="fixedAssetTax" type="text" inputmode="numeric" placeholder="例：80,000（年額）">
  </div>

  <button onclick="calc()">計算する</button>

  <div class="result-title">計算結果</div>
  <div id="result"><span class="result-placeholder">ここに結果が表示されます</span></div>

  <div style="margin-top:16px;font-size:14px;color:#374151;">
    <a href="./hayama-kokuho.html">← 葉山町 かんたん計算に戻る</a>
  </div>

  <div class="back-link" style="margin-top:20px;">
    <a href="./selector.html">制度ポータルへ戻る</a>
  </div>

  <div class="note">
    ※基礎控除43万円を差し引いた簡易計算です。<br>
    ※軽減判定は目安です。正式な判定ではありません。<br>
    ※実際の保険料は自治体の通知や公式案内でご確認ください。
  </div>

  <div style="text-align:center;margin-top:32px;padding-top:20px;border-top:1px solid #e5e7eb;">
    <a href="./selector.html" style="display:inline-block;text-decoration:none;border-radius:10px;padding:6px 18px;background:#7fd4e6;">
      <div style="font-size:16px;font-weight:700;color:#ffffff;letter-spacing:0.02em;">Civic Rule Lab</div>
      <div style="font-size:11px;font-weight:500;color:#ffffff;margin-top:1px;">市民 ↔ 制度</div>
    </a>
  </div>

</div>

<script>const CITY_SLUG = "hayama";</script>
<script src="./js/engine.js?v=2"></script>

</body>
</html>
