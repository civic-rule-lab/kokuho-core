<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>藤沢市 国民健康保険料 計算ツール</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <h1>藤沢市 国保計算ツール</h1>
    <p class="subtitle">国民健康保険料シミュレーション</p>

    <div class="form">
      <div class="form-row">
        <label>前年所得（円）</label>
        <input type="text" id="income" placeholder="例：3000000">
      </div>
      <div class="form-row">
        <label>世帯人数</label>
        <input type="number" id="family" value="1" min="1">
      </div>
      <div class="form-row">
        <label>未就学児人数（0〜6歳）</label>
        <input type="number" id="preschool" value="0" min="0">
      </div>
      <div class="form-row">
        <label>介護保険対象人数（40〜64歳）</label>
        <input type="number" id="care" value="0" min="0">
      </div>
      <div class="form-row">
        <label>給与・年金所得者数</label>
        <input type="number" id="salaryPensionCount" value="1" min="1">
      </div>
      <button onclick="calc()">計算する</button>
    </div>

    <div id="result" class="result">
      ここに結果が表示されます
    </div>

    <p class="note">
      ※簡易計算です。実際の保険料は自治体の通知でご確認ください。
    </p>

    <a href="/" class="back-link">← トップへ戻る</a>
  </div>

  <script src="/engines/kokuho/engine.js?city=fujisawa"></script>
</body>
</html>
