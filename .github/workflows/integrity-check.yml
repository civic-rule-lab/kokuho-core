name: integrity-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub Actions runner の Node.js 20 deprecation 対応 (issue #5)。
# 2026-06-02 以降は強制的に Node.js 24 がデフォルトになり、2026-09-16 に
# Node.js 20 が runner から削除される。FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
# を有効化して、JavaScript actions (actions/checkout, actions/setup-node 等)
# を早期に Node.js 24 上で動作させ、移行時の互換性を CI で先行検証する。
# 詳細: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ─────────────────────────────────────────────────────────────
  # GOVERNANCE §D-3 が求める2件。ローカルの pre-commit は --no-verify で
  # 迂回でき、クラウド実行環境にはそもそもフックが無い（TASKS X132）。
  # サーバ側で再実行して穴を塞ぐ。
  #
  # ★署名監査は「このPR/pushで追加されたコミット」だけを見る。
  #   全履歴を対象にすると 2026-09-04〜05 の20コミット
  #   （クラウドセッションが Claude <noreply@anthropic.com> 名義で直接
  #   コミットしたもの＝X132 の実物）で必ず失敗し、CI が永久に赤になる。
  #   過去分は履歴として残し、今後の混入を止めることを目的とする。
  # ─────────────────────────────────────────────────────────────
  guard:
    name: 署名監査 × 秘密混入検査
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 署名監査でコミット範囲を辿るため

      - name: 署名監査（author/committer が許可リストか）
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # 許可する識別子:
          #   license@civicrulelab.jp        オーナーのコミット
          #   *@users.noreply.github.com     GitHub の noreply 形式
          #   noreply@github.com             gh pr merge --squash の committer
          ALLOW='license@civicrulelab\.jp|@users\.noreply\.github\.com|^noreply@github\.com$'
          ZERO='0000000000000000000000000000000000000000'
          if [ -z "${BASE:-}" ] || [ "${BASE}" = "${ZERO}" ]; then
            RANGE="-1 ${HEAD_SHA}"
          else
            RANGE="${BASE}..${HEAD_SHA}"
          fi
          echo "検査範囲: ${RANGE}"
          COMMITS=$(git log --format='%h' ${RANGE} | wc -l | tr -d ' ')
          echo "対象コミット数: ${COMMITS}"
          BAD=$(git log --format='%ae%n%ce' ${RANGE} | sort -u | grep -viE "${ALLOW}" || true)
          if [ -n "${BAD}" ]; then
            echo "::error::許可リスト外の author/committer が含まれています"
            echo "${BAD}"
            echo ""
            echo "該当コミット:"
            git log --format='  %h %an <%ae> / committer %cn <%ce> | %s' ${RANGE} \
              | grep -viE "${ALLOW}" || true
            exit 1
          fi
          echo "✓ 署名は全て許可リスト内"

      - name: 秘密/個人情報の混入検査（追跡ファイル全体）
        run: |
          set -euo pipefail
          PAT='@(gmail|yahoo|icloud|outlook|hotmail)\.com|/Users/[A-Za-z]|BEGIN (RSA|OPENSSH|PRIVATE) KEY'
          if git grep -nE "${PAT}" -- . ':!.github' ':!scripts/git-hooks' ; then
            echo "::error::個人メール／絶対パス／秘密鍵の混入疑い"
            exit 1
          fi
          echo "✓ 混入なし"

  test-integrity:
    name: registry × 一次資料 × data × HTML 横断検証 (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test-integrity.js
        run: node scripts/test-integrity.js

      - name: Run validate-kokuho-data.js
        run: node scripts/validate-kokuho-data.js

      - name: Run check-numeric-text.cjs (料率 JSON の数値表記が値そのままに書き換わっていないか)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            node scripts/check-numeric-text.cjs --base "origin/$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -q '^0*$'; then
            if git fetch --no-tags --depth=1 origin "$BEFORE_SHA"; then
              node scripts/check-numeric-text.cjs --base "$BEFORE_SHA"
            else
              echo "比較元 $BEFORE_SHA を取得できないためスキップ（PR 側で検査済み）"
            fi
          else
            echo "比較元が無いためスキップ"
          fi

      - name: Run test-sanity-all.js (全 1700+ 自治体 × 8 パターン 計算回帰検出)
        run: node scripts/test-sanity-all.js

      - name: Run test-calc-verify.js (公式計算例との照合)
        run: node scripts/test-calc-verify.js

      - name: Run test-year-wiring.js (ページ⇔engine.js の年度配線回帰)
        run: node scripts/test-year-wiring.js

      - name: Run test-shogakukin.cjs (奨学金コア 区分・減免・給付・多子世帯回帰)
        run: node scripts/test-shogakukin.cjs

      - name: Run test-bridge.cjs (奨学金bridge 年収→住民税→区分 結線回帰)
        run: node scripts/test-bridge.cjs

      - name: Run verify-loan-primary.cjs (貸与型 一次資料実額 全数照合)
        run: node scripts/verify-loan-primary.cjs

      - name: Run verify-loan-oracle.cjs (貸与型 独立オラクル+JASSO公式返還例照合)
        run: node scripts/verify-loan-oracle.cjs
