name: integrity-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GitHub Actions runner の Node.js 20 deprecation 対応 (issue #5)。
# 2026-06-02 以降は強制的に Node.js 24 がデフォルトになり、2026-09-16 に
# Node.js 20 が runner から削除される。FORCE_JAVASCRIPT_ACTIONS_TO_NODE24
# を有効化して、JavaScript actions (actions/checkout, actions/setup-node 等)
# を早期に Node.js 24 上で動作させ、移行時の互換性を CI で先行検証する。
# 詳細: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-integrity:
    name: registry × 一次資料 × data × HTML 横断検証 (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test-integrity.js
        run: node scripts/test-integrity.js

      - name: Run validate-kokuho-data.js
        run: node scripts/validate-kokuho-data.js

      - name: Run test-sanity-all.js (全 1700+ 自治体 × 8 パターン 計算回帰検出)
        run: node scripts/test-sanity-all.js

      - name: Run test-calc-verify.js (公式計算例との照合)
        run: node scripts/test-calc-verify.js

      - name: Run test-year-wiring.js (ページ⇔engine.js の年度配線回帰)
        run: node scripts/test-year-wiring.js
